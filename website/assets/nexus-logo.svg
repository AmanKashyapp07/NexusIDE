<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="nexusGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <linearGradient id="nexusGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF0080" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <filter id="nexusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hexagonal Nexus Ring -->
  <polygon points="24,3 43,14 43,34 24,45 5,34 5,14" 
           stroke="url(#nexusGrad1)" 
           stroke-width="2.5" 
           fill="rgba(10, 15, 30, 0.6)" 
           filter="url(#nexusGlow)" />
  
  <!-- Inner Dynamic Circuit Nodes -->
  <circle cx="24" cy="14" r="3.5" fill="#00F2FE" />
  <circle cx="34" cy="24" r="3" fill="#7928CA" />
  <circle cx="24" cy="34" r="3.5" fill="#FF0080" />
  <circle cx="14" cy="24" r="3" fill="#00F5A0" />
  
  <!-- Connecting Synapse Lines (CRDT Mesh) -->
  <line x1="24" y1="14" x2="34" y2="24" stroke="url(#nexusGrad1)" stroke-width="2" stroke-linecap="round" />
  <line x1="34" y1="24" x2="24" y2="34" stroke="url(#nexusGrad2)" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="34" x2="14" y2="24" stroke="url(#nexusGrad2)" stroke-width="2" stroke-linecap="round" />
  <line x1="14" y1="24" x2="24" y2="14" stroke="url(#nexusGrad1)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Center Quantum Node -->
  <circle cx="24" cy="24" r="4.5" fill="#FFFFFF" />
  <circle cx="24" cy="24" r="2.5" fill="#00F2FE" />
</svg>
