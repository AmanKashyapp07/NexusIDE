<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="nexus-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f0f1a" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="nexus-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Code Chevron Gradient -->
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#nexus-bg)" stroke="url(#nexus-border)" stroke-width="2" />

  <!-- IDE Code Graphics -->
  <g filter="url(#glow)">
    <!-- Left Chevron `<` -->
    <path d="M 21 21 L 11 32 L 21 43" fill="none" stroke="url(#cyan-violet)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Slash `/` -->
    <path d="M 35 19 L 27 45" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" />

    <!-- Right Chevron `>` -->
    <path d="M 43 21 L 53 32 L 43 43" fill="none" stroke="url(#purple-pink)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Nexus Connection Node Dots -->
  <circle cx="32" cy="11" r="2.5" fill="#38bdf8" />
  <circle cx="32" cy="53" r="2.5" fill="#c084fc" />
</svg>